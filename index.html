<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scalping Open Flow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="deck" aria-live="polite"></main>
  <button id="previous" class="nav previous" aria-label="Slide precedente">‹</button>
  <button id="next" class="nav next" aria-label="Slide successiva">›</button>
  <button id="fullscreen" class="fullscreen" aria-label="Schermo intero" title="Schermo intero (F)">⛶</button>
  <div id="counter" class="counter"></div>
  <script src="app.js"></script>
</body>
</html>
